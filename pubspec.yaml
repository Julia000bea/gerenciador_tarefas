name: gerenciador_tarefas
description: Gerenciador de Tarefas Inteligente desenvolvido em Flutter (Dart).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Gerenciamento de estado (ChangeNotifier + Provider)
  provider: ^6.1.2
  # Persistência local (chave-valor, funciona em Android, iOS e Web)
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
